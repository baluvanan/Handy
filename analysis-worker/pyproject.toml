[project]
name = "handy-worker"
# Bump on every change Handy must notice (it compares this with the
# installed environment and offers a one-click re-sync).
version = "0.1.0"
description = "Handy Personal's background verbatim-analysis worker (local only)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
# Core: stdlib only, so tests, `status`, `doctor`, `install` and the queue
# logic run without the model stack.
dependencies = []

[project.optional-dependencies]
# The CrisperWhisper stack. Installed on the Mac with `uv sync --extra model`.
model = [
    # CrisperWhisper's model card requires its own transformers fork for
    # accurate word timestamps (retokenized spaces + adjusted DTW heads).
    # Pinned to the exact commit of its `crisper_whisper` branch.
    "transformers @ git+https://github.com/nyrahealth/transformers.git@8eb900e81d43576d2ddf69cceb1c2bb8b0330bc1",
    # The fork is transformers 4.37.2: tokenizers <0.19, and numpy 1.x.
    "tokenizers>=0.15,<0.19",
    "numpy>=1.26,<2",
    "torch>=2.4,<2.6",
    "accelerate>=0.26,<1.0",
    "huggingface-hub>=0.20,<0.26",
    "safetensors>=0.4.1",
    "soundfile>=0.12",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
handy-worker = "handy_worker.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/handy_worker"]

[tool.uv]
# The model stack only has to resolve for the Mac (and Linux for CI locks);
# tests never install it.
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux'",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["torch.*", "transformers.*", "soundfile.*", "huggingface_hub.*", "numpy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
