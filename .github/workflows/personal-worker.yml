name: "personal-worker"
# Handy Personal: lint, type-check and test the verbatim-analysis worker.
# Uses the fake transcriber, so the model stack is never installed here.
on:
  workflow_dispatch:
  push:
    paths:
      - "analysis-worker/**"
      - ".github/workflows/personal-worker.yml"
  pull_request:
    paths:
      - "analysis-worker/**"
      - ".github/workflows/personal-worker.yml"

jobs:
  worker:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: analysis-worker
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Install (core + dev, locked)
        run: uv sync --frozen
      - name: Ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Pytest
        run: uv run pytest
